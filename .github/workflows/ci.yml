name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-static:
    name: Format & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Check code formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files require gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run static analysis (go vet)
        run: go vet ./...

  unit-tests:
    name: Unit Tests (Offline)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run unit test suite
        run: go test -v ./... -count=1

  race-detector:
    name: Race Detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run test suite with -race
        run: go test -v -race ./... -count=1

  cross-compile:
    name: Build (${{ matrix.target.os }}/${{ matrix.target.arch }})
    needs: [format-static, unit-tests, race-detector]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build cross-platform binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
        run: |
          mkdir -p dist
          BIN="agy-pool-${{ matrix.target.os }}-${{ matrix.target.arch }}"
          go build -trimpath -ldflags="-s -w" -o "dist/${BIN}" ./cmd/agy-pool
          cd dist
          sha256sum "${BIN}" > "${BIN}.sha256"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: agy-pool-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: |
            dist/agy-pool-${{ matrix.target.os }}-${{ matrix.target.arch }}
            dist/agy-pool-${{ matrix.target.os }}-${{ matrix.target.arch }}.sha256
          retention-days: 7

  verify-artifacts:
    name: Cloud Artifact Verification & Packaging
    needs: cross-compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: agy-pool-*
          path: dist
          merge-multiple: true

      - name: Generate unified SHA256SUMS
        run: |
          cd dist
          sha256sum agy-pool-linux-amd64 agy-pool-linux-arm64 agy-pool-darwin-amd64 agy-pool-darwin-arm64 > SHA256SUMS
          cat SHA256SUMS

      - name: Verify native linux-amd64 binary execution
        run: |
          chmod +x dist/agy-pool-linux-amd64

          echo "=== Testing --version ==="
          dist/agy-pool-linux-amd64 --version

          echo "=== Testing --help ==="
          dist/agy-pool-linux-amd64 --help

          echo "=== Testing rejection of removed daemon-run ==="
          set +e
          dist/agy-pool-linux-amd64 daemon-run
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 2 ]; then
            echo "Expected exit code 2, got $STATUS"
            exit 1
          fi
          echo "daemon-run correctly rejected with exit code 2"

      - name: Upload unified SHA256SUMS
        uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          retention-days: 7
